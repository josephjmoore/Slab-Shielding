[project]
name = "slab-shielding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joseph Moore", email = "joe.jack.moore@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openmc-anywhere>=0.16.0.0",
]

[project.scripts]
slab-shielding = "slab_shielding:main"

[build-system]
